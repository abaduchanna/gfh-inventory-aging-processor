version: 2.1

executors:
  win-exe-builder:
    machine:
      image: "windows-server-2022-gui:current"
    resource_class: windows.medium
    shell: powershell.exe

jobs:
  build-exe:
    executor: win-exe-builder
    environment:
      PYTHONUNBUFFERED: 1
    steps:
      - checkout
      
      - run:
          name: Install Python 3.11
          command: |
            Write-Host "Installing Python 3.11..." -ForegroundColor Cyan
            choco install python311 -y --no-progress
            refreshenv
            Write-Host "Python version:" -ForegroundColor Green
            python --version
      
      - run:
          name: Upgrade pip and install build tools
          command: |
            Write-Host "Upgrading pip..." -ForegroundColor Cyan
            python -m pip install --upgrade pip setuptools wheel --no-warn-script-location
            Write-Host "Pip upgraded." -ForegroundColor Green
      
      - run:
          name: Install dependencies from requirements.txt
          command: |
            Write-Host "Installing requirements..." -ForegroundColor Cyan
            if (Test-Path "requirements.txt") {
              python -m pip install -r requirements.txt --no-warn-script-location
              Write-Host "Requirements installed." -ForegroundColor Green
            } else {
              Write-Host "No requirements.txt found, skipping" -ForegroundColor Yellow
            }
      
      - run:
          name: Install PyInstaller
          command: |
            Write-Host "Installing PyInstaller..." -ForegroundColor Cyan
            python -m pip install --upgrade pyinstaller --no-warn-script-location
            Write-Host "PyInstaller installed." -ForegroundColor Green
            pyinstaller --version
      
      - run:
          name: Build EXE files from .spec files
          command: |
            Write-Host "Starting PyInstaller builds..." -ForegroundColor Green
            $specFiles = Get-ChildItem -Filter "*.spec" -ErrorAction SilentlyContinue
            
            if ($specFiles.Count -eq 0) {
              Write-Host "No .spec files found!" -ForegroundColor Red
              exit 1
            }
            
            Write-Host "Found $($specFiles.Count) .spec file(s)" -ForegroundColor Cyan
            
            $failed = 0
            foreach ($spec in $specFiles) {
              Write-Host "Building: $($spec.Name)" -ForegroundColor Cyan
              python -m PyInstaller "$($spec.Name)" --noconfirm --clean --log-level INFO
              
              if ($LASTEXITCODE -ne 0) {
                Write-Host "ERROR building $($spec.Name)!" -ForegroundColor Red
                $failed += 1
              } else {
                Write-Host "✓ Successfully built $($spec.Name)" -ForegroundColor Green
              }
            }
            
            if ($failed -gt 0) {
              Write-Host "Failed to build $failed file(s)" -ForegroundColor Red
              exit 1
            }
      
      - run:
          name: Verify EXE files
          command: |
            Write-Host "Verifying EXE files..." -ForegroundColor Green
            $exeFiles = Get-ChildItem -Path "dist" -Name "*.exe" -ErrorAction SilentlyContinue
            
            if ($null -eq $exeFiles) {
              Write-Host "No EXE files found in dist!" -ForegroundColor Red
              exit 1
            }
            
            if ($exeFiles -is [string]) {
              $exeCount = 1
            } else {
              $exeCount = $exeFiles.Count
            }
            
            Write-Host "Found $exeCount EXE file(s):" -ForegroundColor Green
            if ($exeFiles -is [string]) {
              Write-Host "  ✓ $exeFiles" -ForegroundColor Green
            } else {
              foreach ($exe in $exeFiles) {
                Write-Host "  ✓ $exe" -ForegroundColor Green
              }
            }
      
      - store_artifacts:
          path: dist
          destination: exe-builds
      
      - run:
          name: Build summary
          command: |
            Write-Host "========================================" -ForegroundColor Cyan
            Write-Host "Build Summary" -ForegroundColor Cyan
            Write-Host "========================================" -ForegroundColor Cyan
            $artifacts = Get-ChildItem -Path "dist" -Name "*.exe" -ErrorAction SilentlyContinue
            if ($artifacts -is [string]) {
              $count = 1
            } else {
              $count = $artifacts.Count
            }
            Write-Host "Total EXE files: $count" -ForegroundColor Green
            Write-Host "Status: SUCCESS" -ForegroundColor Green

workflows:
  version: 2.1
  
  build:
    jobs:
      - build-exe:
          filters:
            branches:
              only:
                - main
                - master
          context:
            - windows-builds
